services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: face_reco
      POSTGRES_PASSWORD: face_reco
      POSTGRES_DB: face_reco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face_reco"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://face_reco:face_reco@db:5432/face_reco
    ports:
      - "8000:8000"
    # Create the schema before serving; without this the API starts against an
    # empty database and every enroll/identify call fails.
    command: >-
      sh -c "python scripts/init_db.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
